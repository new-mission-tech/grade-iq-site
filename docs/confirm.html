<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradeIQ — Confirm Email</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07091a;
            --surface: #0e1230;
            --border: #1a2156;
            --accent: #2c72b7;
            --accent-hi: #4fa0e8;
            --navy: #071377;
            --green: #3ecf8e;
            --red: #f76f6f;
            --text: #e8ecf4;
            --muted: #7889b0;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.22;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(44, 114, 183, 0.14) 0%, transparent 68%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(44, 114, 183, 0.08);
        }

        /* ── Logo ── */
        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 32px;
        }

        .logo img {
            width: 28px;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(44, 114, 183, 0.4));
        }

        .logo-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
        }

        /* ── Status icon ── */
        .status-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .status-icon.success {
            background: rgba(62, 207, 142, 0.1);
            color: var(--green);
            border: 1px solid rgba(62, 207, 142, 0.25);
        }

        .status-icon.failure {
            background: rgba(247, 111, 111, 0.1);
            color: var(--red);
            border: 1px solid rgba(247, 111, 111, 0.25);
        }

        .status-icon.loading {
            background: rgba(44, 114, 183, 0.1);
            color: var(--accent-hi);
            border: 1px solid rgba(44, 114, 183, 0.25);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .close-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.7;
        }

        [data-view] {
            display: none;
        }

        [data-view].active {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--accent-hi);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
    </style>
</head>

            <div class="status-icon loading">
                <div class="spinner"></div>
            </div>
            <h1>Confirming…</h1>
            <p class="subtitle">Just a moment.</p>
        </div>

        <div data-view="confirmed">
            <div class="status-icon success">✓</div>
            <h1>Email confirmed</h1>
            <p class="subtitle">Your account is verified. Open the GradeIQ extension and sign in.</p>
            <p class="close-note">You can close this tab.</p>
        </div>

        <div data-view="error">
            <div class="status-icon failure">✕</div>
            <h1>Link expired</h1>
            <p class="subtitle" id="error-detail">This confirmation link is invalid or has expired. Please sign up again
                from the GradeIQ extension.</p>
            <p class="close-note">You can close this tab.</p>
        </div>
    </div>

    <script>
        const SUPABASE_KEY = '%%SUPABASE_KEY%%';

        function show(v) {
            document.querySelectorAll('[data-view]').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-view="' + v + '"]').classList.add('active');
        }

        function parseParams() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const query = new URLSearchParams(window.location.search);
            const merged = new URLSearchParams();
            for (const [k, v] of hash) merged.set(k, v);
            for (const [k, v] of query) merged.set(k, v);
            return merged;
        }

        const params = parseParams();
        const error = params.get('error');
        const errorDesc = params.get('error_description');
        const type = params.get('type');
        const accessToken = params.get('access_token');

        if (error) {
            const detail = document.getElementById('error-detail');
            if (errorDesc) {
                detail.textContent = decodeURIComponent(errorDesc).replace(/\+/g, ' ')
                    + ' Please sign up again from the GradeIQ extension.';
            }
            show('error');
        } else if (type === 'signup' || type === 'email_change' || accessToken) {
            show('confirmed');
        } else {
            show('error');
        }
    </script>
