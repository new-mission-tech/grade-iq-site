<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradeIQ</title>
    <script>
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const type = hash.get('type');
        const error = hash.get('error');
        if (error) {
            window.location.replace('/confirm.html' + window.location.hash);
        } else if (type === 'recovery') {
            window.location.replace('/reset-password.html' + window.location.hash);
        } else if (type === 'signup' || type === 'email_change' || hash.get('access_token')) {
            window.location.replace('/confirm.html' + window.location.hash);
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07091a;
            --border: #1a2156;
            --accent: #2c72b7;
            --accent-hi: #4fa0e8;
            --text: #e8ecf4;
            --muted: #7889b0;
            --muted-dim: #4a5880;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.2;
            pointer-events: none;
        }

        /* Glow */
        body::after {
            content: '';
            position: fixed;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 560px;
            height: 560px;
            background: radial-gradient(ellipse, rgba(44, 114, 183, 0.2) 0%, transparent 68%);
            pointer-events: none;
        }

        .wrap {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0;
            padding: 20px;
        }

        /* Logo card image */
        .logo-img {
            width: 96px;
            height: auto;
            filter: drop-shadow(0 12px 40px rgba(44, 114, 183, 0.55)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
            margin-bottom: 28px;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: translateY(-3px);
        }

        /* Brand name */
        .brand {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 7px;
            word-spacing: 10px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* Divider */
        .divider {
            width: 32px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 18px;
        }

        /* Tagline */
        .tagline {
            font-size: 14px;
            color: var(--muted-dim);
            letter-spacing: 0.03em;
            line-height: 1.6;
            max-width: 260px;
        }

        /* Coming soon pill */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 32px;
            padding: 7px 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-dim);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .pill-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-hi);
            opacity: 0.7;
        }
    </style>
</head>
